group=com.celestirift
version=2.0.0-SNAPSHOT

# Paper API build to compile against. Override per-build for compatibility checks:
#   ./gradlew build -PpaperVersion=26.4.build.+
# Minimum supported server build: compile against it so newer-only API fails at compile
# time instead of NoSuchMethodError on servers (CI also builds against the latest build).
paperVersion=26.3.build.252-stable
# Minecraft version runServer downloads (should match paperVersion).
minecraftVersion=26.3

# Publishing (Hangar / Modrinth project slugs and the versions listed on the upload).
hangarProject=CelestiRift
modrinthProject=celestirift
supportedMinecraftVersions=26.3

# Fail the build on deprecated API use (keeps us ready for the next major).
strictDeprecation=true

org.gradle.caching=true
org.gradle.configuration-cache=true

# Where `./gradlew deploy` copies the plugin jar (your test server's plugins folder).
deployDir=C:/Users/LOQ/Desktop/MCS/test/plugins

# OrionRP API version for the optional integration (see celestirift-core/build.gradle.kts).
orionrpVersion=0.1.0-SNAPSHOT
