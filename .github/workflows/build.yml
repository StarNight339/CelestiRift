name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: catch breakage from new Paper builds early

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned
            paper: "" # use gradle.properties
          - name: latest-26.3
            paper: "26.3.build.+"
          # Uncomment when Paper 26.4 API is published:
          # - name: next-26.4
          #   paper: "26.4.build.+"
    name: Paper ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          if [ -n "${{ matrix.paper }}" ]; then
            # Newer builds may deprecate API we still need for older servers: check
            # compatibility only (no -Werror on deprecations) for the latest build.
            ./gradlew build resourcePack "-PpaperVersion=${{ matrix.paper }}" -PstrictDeprecation=false
          else
            ./gradlew build resourcePack
          fi
      # Boot a real Paper server (latest build of minecraftVersion) and run the plugin's
      # self test: every skill cast, every boss spawned, safe reload, no errors logged.
      - name: In-server smoke test
        if: matrix.name == 'pinned'
        run: ./gradlew :celestirift-core:smokeTest
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'pinned'
        with:
          name: CelestiRift
          path: |
            celestirift-core/build/libs/CelestiRift-*.jar
            celestirift-core/build/resourcepack/CelestiRift-pack.zip*
