# =====================================================================
#  CelestiRift skills folder - layout and conventions (this file has no skills)
#
#  Every .yml/.yaml file under skills/ is loaded, in any sub-folder.
#
#  skills/
#    shared/effects.yml    Fx_* - reusable impact effects (fire, frost, holy...)
#    gems/<skill>.yml      skills granted by gems.yml (Fireball, FrostNova, Heal, Smite...)
#    classes/<class>.yml   a class kit + its passives (Mage, Warrior, Cleric)
#    bosses/<boss>.yml     skills a boss casts (bosses/<boss>.yml holds the boss itself)
#    showcase/<topic>.yml  examples to learn from and copy - nothing depends on them
#
#  Naming
#    Castable skill      PascalCase           Fireball, Frostbolt, Warcry
#    Helper of a skill   <Skill>_<Part>       Fireball_Impact, Rend_Tick, Renew_Tick
#                       (onhit / onland / onend / ontick targets, kept in the same file)
#    Boss skill          <Boss>_<Move>        FrostLord_Nova, FrostLord_Lance
#    Shared effect       Fx_<Name>            Fx_FireBurst (call with "- skill: Fx_FireBurst")
#
#  Skill block order (keep it the same everywhere, easy to scan)
#    description, cooldown, mana, cast-time, cast-interrupt, conditions, item, skills
#
#  Colour palette (DUST / DUST_COLOR_TRANSITION: color -> tocolor)
#    fire    #ff3d00 -> #ffb300      frost   #38bdf8 -> #e0f2fe
#    arcane  #a855f7 -> #f0abfc      holy    #fde047 -> #fffbeb
#    blood   #b91c1c -> #f97316      shadow  #4c1d95 -> #0f0a1a
#    nature  #22c55e -> #bbf7d0      storm   #60a5fa -> #e0e7ff
#
#  Inside helpers cast at an impact (onhit/onland/onend), effects belong at
#  "target: origin" (the impact point); "target: casterLocation" is the caster.
#
#  Reference of every mechanic/targeter/condition: plugins/CelestiRift/docs/reference.md
#  VS Code autocomplete: keep the "# yaml-language-server" line at the top of each file.
# =====================================================================
