# yaml-language-server: $schema=../../schema/skills.schema.json
# Storm Gem (gems.yml) - lightning that leaps from enemy to enemy.

ChainLightning:
  description: "<gray>Lightning that leaps between up to 5 enemies, weaker with every jump."
  cooldown: 6
  mana: 25
  skills:
  - helix: { particle: DUST_COLOR_TRANSITION, color: "#60a5fa", tocolor: "#e0e7ff", size: 0.9, radius: 0.6, height: 2.2, coils: 2, points: 24, strands: 2 }
    target: casterLocation
  - chain: { damage: "7 + <caster.level> * 0.25", jumps: 5, radius: 6, decay: 0.8, color: "#93c5fd", onhit: ChainLightning_Hit }
    target: { target: 25 }
  - sound: { sound: entity.lightning_bolt.thunder, volume: 0.35, pitch: 1.9 }

ChainLightning_Hit:
  skills:
  - skill: Fx_StormBurst
