# yaml-language-server: $schema=../../schema/skills.schema.json
# Fusion (fusions.yml): Ember Gem + Dark Gem -> Blackfire. A soul-fire orb that
# collapses into a small singularity, dragging enemies in before it bursts.

BlackfireBall:
  description: "<gray>A soul-fire orb that collapses into a singularity, then bursts."
  cooldown: 8
  mana: 45
  skills:
  - projectiletrail: { particle: SOUL_FIRE_FLAME, speed: 0.9, maxdistance: 30, shape: helix, shaperadius: 0.45, shapepoints: 3, coilspeed: 1.4, hitradius: 1.2, onhit: BlackfireBall_Impact }
  - sound: { sound: entity.wither.shoot, volume: 0.7, pitch: 1.3 }

BlackfireBall_Impact:
  skills:
  - blackhole: { particle: DUST, color: "#4c1d95", size: 1.3, radius: 3.5, arms: 3, points: 20, duration: 30, pull: true, pullstrength: 0.35 }
    target: origin
  - delay: 30
  - damage: "8 + <caster.level> * 0.35"
    target: { nearby: 4 }
  - ignite: 80
    target: { nearby: 4 }
  - skill: Fx_ShadowBurst
