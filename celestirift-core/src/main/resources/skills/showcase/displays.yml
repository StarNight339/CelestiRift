# yaml-language-server: $schema=../../schema/skills.schema.json
# =====================================================================
#  3D effects with display entities - more in skills/gems/ (SwordRain, Starfall,
#  ChainLightning). No resource pack needed; with a pack you
#  can show any custom model: display: { type: item, model: "celestirift:my_sword" }).
#
#  - display: { type: block|item|text, material: ICE, model: ..., text: "<red>!",
#               scale: 1, endscale: 2, spin: 10, tilt: 90, rise: 1.5, y: 0,
#               duration: 40, follow: false, glow: false, glowcolor: "#ff0000",
#               billboard: fixed|center|vertical|horizontal, onend: Skill }
#    spin = degrees per tick, tilt = degrees forward, rise = blocks over the duration
#    (negative = fall). onend casts a skill where the display ended.
#  - meteor: { block: MAGMA_BLOCK, height: 18, drift: 6, duration: 20, scale: 1.6,
#              trail: FLAME, onland: Skill }
#  - chain: { damage: 6, jumps: 4, radius: 6, decay: 0.8, delay: 3, color: "#9be7ff",
#             onhit: Skill }
#
#  Floating damage numbers: config.yml -> vfx.damage-numbers
#  Effects are never saved to disk and vanish on /cr reload or restart.
# =====================================================================

# Swords appear above every enemy nearby and fall onto them.
# Ice spikes grow out of the ground under enemies.
IceSpikes:
  description: "<gray>Ice erupts under enemies around you, slowing them."
  cooldown: 9
  mana: 30
  skills:
  - display: { type: block, material: PACKED_ICE, scale: 0.1, endscale: 1.3, tilt: 15, duration: 8, onend: IceSpikes_Hit }
    target: { nearby: { radius: 7, limit: 5 } }
  - sound: { sound: block.glass.break, pitch: 0.7 }

IceSpikes_Hit:
  skills:
  - damage: 6
    target: { nearby: 1.5 }
  - potion: { type: SLOWNESS, duration: 60, level: 3 }
    target: { nearby: 1.5 }
  - particle: { type: SNOWFLAKE, amount: 20, spread: 0.6 }
    target: origin

# A warned meteor: the circle and the fall take the same time.
Meteor:
  description: "<gray>Call a meteor where you look. Enemies get a 1 s warning."
  cooldown: 12
  mana: 40
  skills:
  - telegraph: { radius: 4, duration: 20, color: "#ff5a1a" }
    target: { targetLocation: { range: 30 } }
  - meteor: { block: MAGMA_BLOCK, duration: 20, height: 18, onland: Meteor_Impact }
    target: { targetLocation: { range: 30 } }

Meteor_Impact:
  skills:
  - damage: "8 + <caster.level> * 0.3"
    target: { nearby: 4 }
  - ignite: 60
    target: { nearby: 4 }
  - skill: Fx_FireBurst

# A spell book spinning above your head for 5 s (pure visual, follows you).
ArcaneFocus:
  description: "<gray>A rune book circles above you; +15% damage for 5 s."
  cooldown: 20
  mana: 20
  skills:
  - display: { type: item, material: ENCHANTED_BOOK, scale: 0.7, y: 2.4, spin: 9, follow: true, duration: 100, glow: true, glowcolor: "#b26bff" }
    target: casterLocation
  - aura: { id: ArcaneFocus, duration: 100, damage-dealt: 0.15 }

# A boss shout floating above its head.
Shout:
  skills:
  - display: { type: text, text: "<red><bold>RAAAH!", y: 2.6, rise: 0.8, scale: 1.5, duration: 30 }
    target: casterLocation
